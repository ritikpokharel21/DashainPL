<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashain Premier League 🪁</title>
<meta name="description" content="Dashain Premier League — Marriage card game season standings, day-wise ranks, player stats and settlements.">
<meta name="theme-color" content="#7f1d1d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Bump DPL_BUILD on every deploy. The page checks it is the latest copy:
   if the browser served a stale cached index.html, it reloads fresh. */
var DPL_BUILD=61;
(function(){
  if(!/^https?:/.test(location.protocol)) return;
  var done=false;
  function freshCheck(){
    if(done || typeof fetch!=='function') return;
    fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
      var m=t.match(/DPL_BUILD\s*=\s*(\d+)/);
      if(m && +m[1]!==DPL_BUILD && !done){
        done=true;
        location.href=location.pathname+'?fresh='+Date.now()+location.hash;
      }
    }).catch(function(){});
  }
  window.addEventListener('pageshow', function(){ freshCheck(); daysLeft(); });
  document.addEventListener('DOMContentLoaded', daysLeft);
  /* Days left in the season (ends Nov 15, 2026) — shown under the header title, updates daily */
  function daysLeft(){
    try{
      var el=document.querySelector('.tb-sub'); if(!el) return;
      var now=new Date(); now.setHours(0,0,0,0);
      var end=new Date(2026,10,15); end.setHours(0,0,0,0);
      var d=Math.round((end-now)/86400000);
      el.textContent = d>1 ? d+' days left' : d===1 ? '1 day left' : d===0 ? 'Last day!' : 'Season complete';
    }catch(e){}
  }
})();
</script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=20">
</head>
<body>
<div id="phone">
  <header id="topbar">
    <div class="tb-in">
      <div class="tb-kite">🪁</div>
      <div class="tb-txt">
        <div class="tb-title">Dashain Premier League</div>
        <div class="tb-sub">Season 2026</div>
      </div>
      <button class="icon-btn" id="musicBtn" onclick="App.toggleMusic()" title="Play music">🎵</button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<script src="js/seed.js?v=50"></script>
<script src="js/app.js?v=62"></script>
<div id="ytWrap" aria-hidden="true"><div id="ytPlayer"></div></div>
</body>
</html>
